# Configuration file for YREC test suite

[paths]

# Location of YREC executable to test
yrec = src/yrec

# Test input locations
# Entries in this list may be directories where nml1,nml2 pairs are found.
# All corresponding nml1,nml2 pairs will be collected as test cases and
# run.
#
# A comma-separated list of
#   directory, nm1-file, nml2-file
# may also be used to define a single test case. e.g.
#   examples/run_from_dbl_to_zams, Test_m0050_feh0_noGS_ZAMS.nml1, run_from_dbl_to_zams.nml2
tests =
    testsuite
    examples/giant_differential_rotation
    examples/run_from_dbl_to_zams
    examples/run_from_seed_to_start
    examples/run_from_start_to_dbl
    examples/run_from_zahb_to_tahb
    examples/run_rotation_to_RG
    examples/run_standard_solar_model
    examples/test_nuclear_reaction_rates
    #testsuite, Test_m9p0feh+0p0GS98_base_TAHB.nml1, Test_m9p0feh+0p0GS98_base_TAHB.nml2 
    #examples/run_from_zahb_to_tahb, Solar_m1p0feh+0p0_GN93_MESA_TAHB.nml1, Solar_m1p0feh+0p0_GN93_MESA_TAHB.nml2
    #examples/giant_differential_rotation


# Subdirectory of each test directory which will hold test reference outputs
# used for comparison of future runs.
reference_dir = standard

[options]
show_output_upon_failure = True

# Control whether or not differences in the version values stored in output
# file headers will cause a comparison with a reference standard output to
# fail.
# If True, differences in application version (e.g. v202602) or commit hash
# (4ede684) or (4ede684-dirty) will be ignored to cut down on extraneous noise
# during development testing.
ignore_version_diffs = True

[tolerances]
float_frac_tol = 0.02
int_abs_tol    = 0


# Lines that should never take part in an output-vs-reference comparison.
#
# Each entry is a Python regular expression, one per line, matched anywhere
# in the line (re.search, not anchored). A matching line is dropped from the
# reference and from the output independently, each judged on its own text,
# so a line that occurs in only one of the two files is removed from that
# file alone and does not shift the comparison of everything after it.
#
# This is the place to neutralize an output change that is known to be
# cosmetic, instead of regenerating every reference. For example, removing a
# dead variable from a namelist shortens the echo written to .short by one
# line in all 301 cases; an ignore rule for that line keeps the existing
# references usable.
#
# Two cautions:
#  - A pattern may not begin with '#' or ';'. configparser treats such a
#    line as a comment and silently discards it, even when indented. Match
#    on text after the '#' instead: use "YREC v.* \(.*\)", not
#    "# YREC v.* \(.*\)".
#  - A rule hides real differences on the lines it matches, so keep the
#    patterns narrow and prefer anchoring to a variable name, e.g.
#    "^\s*LSCRIB\s*=" rather than "LSCRIB".
#
# The version banner is handled separately by ignore_version_diffs above and
# needs no rule here.
# Active rule: CMIXL was dropped from the output-only DERIVED namelist
# on 2026-10-13. PARMIN runs once, before the run loop, so it never held
# the per-run value main.f derives as CMIXL = CMIXLA(NK), and the echo
# always printed the 1.4 DATA default regardless of the namelist. CMIXLA
# is echoed with CONTROL and carries the real per-run values, so nothing
# is lost. This rule keeps the existing .short references valid instead of
# regenerating all 298; it matches only the now-stale reference line and
# retires itself the next time references are regenerated.
[ignore]
patterns =
    ^\s*CMIXL\s*=


# Namelist variables that must not appear in any test-suite input file.
#
# One bare variable name per line, matched case-insensitively against an
# assignment to that name (a mention inside a comment does not count).
# test_namelists_free_of_banned_variables checks every collected case and
# fails with the file and line of each offender.
#
# A name belongs here while it is dead in the code but the code still
# declares it in a namelist group. That window is the dangerous one: a
# namelist read fails on a name its group does not declare, so the inputs
# must be cleaned before the code is, and in the meantime nothing warns if
# a newly added case reintroduces the name -- it reads perfectly well until
# the code-side removal lands, and then every such case breaks at once.
#
# Remove a name from this list once it is gone from the code as well, since
# at that point the namelist read itself is the check.
[banned]
variables =
    LENVG
